<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТАБЛЄТОЧКІ ЩАСТЯ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:'Courier New',monospace;user-select:none;-webkit-user-select:none}
#c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges;z-index:0;background:#000}
.ov{position:absolute;inset:0;pointer-events:none}
#scan{z-index:8;background:repeating-linear-gradient(0deg,rgba(0,0,0,.24) 0 1px,transparent 1px 3px)}
#vig{z-index:9;background:radial-gradient(ellipse at center,transparent 52%,rgba(0,0,0,.85) 100%)}
#noise{z-index:9;opacity:.07;animation:nz .35s steps(3) infinite}
@keyframes nz{0%{background-position:0 0}33%{background-position:-60px 40px}66%{background-position:40px -70px}100%{background-position:-30px -30px}}
#tag{position:absolute;top:14px;left:16px;z-index:10;font-size:12px;letter-spacing:3px;color:#565b52}
#msg{position:absolute;left:50%;bottom:11%;transform:translateX(-50%);z-index:10;
 max-width:640px;text-align:center;color:#cfd3c8;font-size:19px;letter-spacing:1px;line-height:1.7;
 text-shadow:0 0 8px #000,0 0 2px #000;animation:msgP 2.4s ease-in-out infinite}
@keyframes msgP{50%{opacity:.55}}
#fade{position:absolute;inset:0;background:#000;opacity:0;transition:opacity .9s;z-index:12;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" width="512" height="288"></canvas>
<div class="ov" id="scan"></div>
<div class="ov" id="noise"></div>
<div class="ov" id="vig"></div>
<div id="tag">Від Пана Топчіка і Пана Топ Коментаря</div>
<div id="msg">Открий банку щоб ми з тобою моглі начати нашє пріключеніє ю!</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
"use strict";
if(typeof THREE!=='undefined'){(function(){
const $=id=>document.getElementById(id);
const cv=$('c'),msgEl=$('msg'),fadeEl=$('fade');

(()=>{const n=document.createElement('canvas');n.width=n.height=140;const x=n.getContext('2d');
const im=x.createImageData(140,140);for(let i=0;i<im.data.length;i+=4){const v=Math.random()*255|0;
im.data[i]=v;im.data[i+1]=v;im.data[i+2]=v;im.data[i+3]=255;}x.putImageData(im,0,0);
$('noise').style.backgroundImage='url('+n.toDataURL()+')';})();

const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:false});
renderer.setPixelRatio(1);renderer.setSize(512,288,false);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(55,512/288,0.1,100);
camera.position.set(0,3.1,6.6);

function fit(){const wa=innerWidth/innerHeight,va=512/288;let w,h;
if(wa>va){w=innerWidth;h=innerWidth/va;}else{h=innerHeight;w=innerHeight*va;}
cv.style.width=w+'px';cv.style.height=h+'px';}
addEventListener('resize',fit);fit();

scene.add(new THREE.HemisphereLight(0x8fa3c0,0x101018,.75));
const key=new THREE.DirectionalLight(0xcfe0ff,.95);key.position.set(4,7,6);scene.add(key);
const rim=new THREE.PointLight(0x3355aa,.5);rim.position.set(-5,3,-4);scene.add(rim);

function labelTexture(){
 const c=document.createElement('canvas');c.width=256;c.height=256;const x=c.getContext('2d');
 x.fillStyle='#d9d4c2';x.fillRect(0,0,256,256);
 x.fillStyle='#b8b09a';x.fillRect(0,0,256,8);x.fillRect(0,248,256,8);
 x.strokeStyle='#8f8871';x.lineWidth=4;x.strokeRect(6,6,244,244);
 x.textAlign='center';
 x.fillStyle='#1d3b7a';x.font='bold 34px "Courier New"';
 x.fillText('Таблєточкі',128,104);
 x.fillText('щастя',128,152);
 x.fillStyle='#7a3030';x.font='13px "Courier New"';
 x.fillText('ПРИЙМАТИ ВСЕРЕДИНУ',128,204);
 const t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;
 t.generateMipmaps=false;return t;}

const jarG=new THREE.Group();scene.add(jarG);
const jarMat=new THREE.MeshPhongMaterial({color:0x2a63b8,transparent:true,opacity:.88,
 shininess:90,emissive:0x0a1e3a,specular:0x9db8e8});
const body=new THREE.Mesh(new THREE.CylinderGeometry(.95,.9,2.4,24),jarMat);
body.position.y=1.2;jarG.add(body);
const neck=new THREE.Mesh(new THREE.CylinderGeometry(.78,.88,.28,24),jarMat);
neck.position.y=2.52;jarG.add(neck);
const mouth=new THREE.Mesh(new THREE.CircleGeometry(.7,20),
 new THREE.MeshBasicMaterial({color:0x050d1d}));
mouth.rotation.x=-Math.PI/2;mouth.position.y=2.67;jarG.add(mouth);
/* етикетка — два вигнуті сегменти спереду і ззаду, текст без спотворень */
const labMat=new THREE.MeshLambertMaterial({map:labelTexture()});
const THETA=1.25;
const labF=new THREE.Mesh(new THREE.CylinderGeometry(.985,.985,1.15,12,1,true,-THETA/2,THETA),labMat);
labF.position.y=1.15;jarG.add(labF);
const labB=new THREE.Mesh(new THREE.CylinderGeometry(.985,.985,1.15,12,1,true,Math.PI-THETA/2,THETA),labMat);
labB.position.y=1.15;jarG.add(labB);

const lidG=new THREE.Group();lidG.position.set(0,2.75,0);scene.add(lidG);
const lidMat=new THREE.MeshPhongMaterial({color:0x14243f,shininess:50,transparent:true,
 emissive:0x050b18,specular:0x6688bb});
const lidCap=new THREE.Mesh(new THREE.CylinderGeometry(1.02,1.02,.34,24),lidMat);
lidCap.position.y=.17;lidG.add(lidCap);
const lidRim=new THREE.Mesh(new THREE.TorusGeometry(1.02,.04,8,24),lidMat);
lidRim.rotation.x=Math.PI/2;lidRim.position.y=.02;lidG.add(lidRim);
const lidTop=new THREE.Mesh(new THREE.CylinderGeometry(.68,.68,.06,24),
 new THREE.MeshPhongMaterial({color:0x0b1526,shininess:30,transparent:true}));
lidTop.position.y=.36;lidG.add(lidTop);

const COLS=[[0xe8e4da,0xd64541],[0xe8e4da,0x3a7bd5],[0xe8e4da,0xe8a33d],
            [0xe8e4da,0x58b368],[0xe8e4da,0xb06ab3],[0xe8e4da,0x3fbf9f]];
const pills=[];const pillMeshes=[];
function makePill(cA,cB){
 const g=new THREE.Group();
 const r=.16,half=.17;
 const mA=new THREE.MeshPhongMaterial({color:cA,shininess:70,emissive:0x000000});
 const mB=new THREE.MeshPhongMaterial({color:cB,shininess:70,emissive:0x000000});
 const cylA=new THREE.Mesh(new THREE.CylinderGeometry(r,r,half,12),mA);
 cylA.rotation.z=Math.PI/2;cylA.position.x=-half/2;g.add(cylA);
 const cylB=new THREE.Mesh(new THREE.CylinderGeometry(r,r,half,12),mB);
 cylB.rotation.z=Math.PI/2;cylB.position.x=half/2;g.add(cylB);
 const sA=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),mA);sA.position.x=-half;g.add(sA);
 const sB=new THREE.Mesh(new THREE.SphereGeometry(r,12,8),mB);sB.position.x=half;g.add(sB);
 scene.add(g);
 g.traverse(o=>{if(o.isMesh)pillMeshes.push(o);});
 return {g,mA,mB};}
for(let i=0;i<6;i++){
 const m=makePill(COLS[i][0],COLS[i][1]);
 const a=Math.random()*Math.PI*2,rr=Math.random()*.4;
 const sx=Math.cos(a)*rr,sz=Math.sin(a)*rr,sy=.32+(i%3)*.22;
 m.g.position.set(sx,sy,sz);
 m.g.rotation.set(Math.random()*.4-.2,Math.random()*Math.PI,Math.random()*.4-.2);
 pills.push({g:m.g,mA:m.mA,mB:m.mB,state:'idle',x:sx,y:sy,z:sz,
  vx:0,vy:0,vz:0,dir:null,spin:(Math.random()*2-1)*7,landed:false});}
pills.forEach(p=>p.g.traverse(o=>{if(o.isMesh)o.userData.pill=p;}));

let AC=null,noiseBuf=null;
function initAudio(){
 if(AC)return;
 try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
 if(AC.resume)AC.resume();
 const len=AC.sampleRate;noiseBuf=AC.createBuffer(1,len,AC.sampleRate);
 const d=noiseBuf.getChannelData(0);
 for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*.6;}
function nz(vol,fq,dur,type){if(!AC)return;const t=AC.currentTime;
 const s=AC.createBufferSource();s.buffer=noiseBuf;
 const f=AC.createBiquadFilter();f.type=type||'bandpass';f.frequency.value=fq;f.Q.value=1;
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
 s.connect(f);f.connect(g);g.connect(AC.destination);s.start(t,Math.random()*.5,dur+.05);}
function tone(freq0,freq1,dur,vol,type){if(!AC)return;const t=AC.currentTime;
 const o=AC.createOscillator();o.type=type||'sine';
 o.frequency.setValueAtTime(freq0,t);o.frequency.exponentialRampToValueAtTime(freq1,t+dur);
 const g=AC.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur+.03);
 o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+.05);}
const popSnd=()=>{tone(190,55,.2,.5);nz(.35,900,.16);};
const tickSnd=()=>nz(.14,1600+Math.random()*700,.06,'highpass');
const swallow=()=>{tone(392,784,.14,.2,'triangle');setTimeout(()=>tone(523,1046,.16,.18,'triangle'),120);};

let opened=false,lidT=-1,pillsStarted=false,pillTimer=0,nextPill=0,landedCount=0;
let picked=false,pickedPill=null,pickT=0,time=0;
const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

function ndc(e){const r=cv.getBoundingClientRect();
 return {x:((e.clientX-r.left)/r.width)*2-1,y:-((e.clientY-r.top)/r.height)*2+1};}

addEventListener('mousemove',e=>{
 const m=ndc(e);mouse.set(m.x,m.y);
 raycaster.setFromCamera(mouse,camera);
 let hit=false;
 if(!opened){hit=raycaster.intersectObject(lidG,true).length>0;}
 else{hit=raycaster.intersectObjects(pillMeshes,false).some(h=>h.object.userData.pill&&h.object.userData.pill.landed);}
 cv.style.cursor=hit?'pointer':'default';});

addEventListener('click',e=>{
 const m=ndc(e);mouse.set(m.x,m.y);
 raycaster.setFromCamera(mouse,camera);
 if(!opened){
  if(raycaster.intersectObject(lidG,true).length>0)openJar();
  return;}
 if(picked)return;
 const hits=raycaster.intersectObjects(pillMeshes,false);
 for(const h of hits){
  const p=h.object.userData.pill;
  if(p&&p.landed){pickPill(p);break;}}});

function openJar(){
 opened=true;lidT=0;
 initAudio();popSnd();
 setTimeout(()=>{pillsStarted=true;},380);}

function pickPill(p){
 picked=true;pickedPill=p;pickT=0;
 swallow();
 p.mA.emissive.set(0x9fd8ff);p.mB.emissive.set(0x9fd8ff);
 setTimeout(()=>{fadeEl.style.opacity='1';},500);
 setTimeout(()=>{window.location.href='1.html';},1500);}


function launchPill(p){
 p.state='fly';
 const a=Math.random()*Math.PI*2;
 p.dir={x:Math.cos(a),z:Math.sin(a)};
 p.vx=p.dir.x*.5+(Math.random()-.5)*.5;
 p.vz=p.dir.z*.5+(Math.random()-.5)*.5;
 p.vy=7.4+Math.random()*1.4;}

let last=performance.now();
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;

 camera.position.x=Math.sin(time*.35)*.3;
 camera.position.y=3.1+Math.sin(time*.5)*.08;
 camera.lookAt(0,1.7,0);

 if(!opened){
  lidMat.emissive.setScalar(.02+.03*(1+Math.sin(time*3)));}

 if(lidT>=0&&lidT<1){
  lidT+=dt/0.9;
  const t=Math.min(1,lidT);
  lidG.position.x=2.5*t;
  lidG.position.y=2.75+Math.sin(t*Math.PI)*1.35;
  lidG.position.z=.5*t;
  lidG.rotation.z=-1.5*t;
  const op=t>.7?Math.max(0,1-(t-.7)/.3):1;
  lidMat.opacity=op;lidTop.material.opacity=op;
  if(lidT>=1)lidG.visible=false;}

 if(pillsStarted&&nextPill<pills.length){
  pillTimer+=dt;
  if(pillTimer>.14){pillTimer=0;launchPill(pills[nextPill]);nextPill++;}}

 for(const p of pills){
  if(p.state!=='fly')continue;
  p.vy-=10*dt;
  if(p.y>2.7){
   p.vx+=(p.dir.x*2.5-p.vx)*Math.min(1,dt*2.5);
   p.vz+=(p.dir.z*2.5-p.vz)*Math.min(1,dt*2.5);}
  p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
  p.g.rotation.y+=p.spin*dt;
  if(p.y<.16&&p.vy<0){
   p.y=.16;p.vy=-p.vy*.38;p.vx*=.72;p.vz*=.72;p.spin*=.6;
   if(Math.abs(p.vy)<.6){
    p.vy=0;p.state='landed';p.landed=true;
    p.g.position.set(p.x,.16,p.z);
    tickSnd();landedCount++;
    if(landedCount===pills.length)msgEl.textContent='А тєпєр возьмі одну таблєточку ю.';}}
  p.g.position.set(p.x,p.y,p.z);}

 if(pickedPill){
  pickT+=dt;
  const s=1+pickT*1.4;
  pickedPill.g.scale.setScalar(Math.min(1.6,s));
  pickedPill.g.rotation.y+=dt*4;}

 renderer.render(scene,camera);}
requestAnimationFrame(loop);
})();}
else{
 document.getElementById('msg').innerHTML=
 '<span style="color:#ff5040">НЕ ВДАЛОСЯ ЗАВАНТАЖИТИ THREE.JS</span><br>'+
 '<span style="font-size:13px;color:#999">потрібен інтернет · онови сторінку</span>';}
</script>
</body>
</html>
