<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>666</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'VT323','Courier New',monospace;user-select:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:none}
  #noiseC{position:fixed;inset:0;width:100vw;height:100vh;opacity:.07;pointer-events:none;z-index:5;mix-blend-mode:screen}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 40%,rgba(40,0,0,.72) 100%)}
  #redflash{position:fixed;inset:0;background:#a00;opacity:0;pointer-events:none;z-index:7;transition:opacity .2s}
  #bloodOv{position:fixed;inset:0;background:rgba(90,0,0,0);pointer-events:none;z-index:7;transition:background 1s}
  #deepBlood{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(130,0,0,.55) 0%,rgba(80,0,0,.92) 100%);opacity:0;pointer-events:none;z-index:7;transition:opacity 1.8s}
  .hud{position:fixed;z-index:8;pointer-events:none;color:#e8c8c0;text-shadow:2px 2px 0 #200}
  #obj{top:14px;left:16px;font-size:21px;letter-spacing:1px}
  #sub{bottom:7%;left:50%;transform:translateX(-50%);font-size:27px;text-align:center;width:86%;transition:opacity .6s}
  #cross{top:50%;left:50%;transform:translate(-50%,-50%);font-size:20px;color:#ff8070;opacity:.7}
  #intro{position:fixed;inset:0;z-index:20;background:#0a0000;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#e8c8c0;text-align:center;cursor:pointer}
  #introTxt{font-size:32px;line-height:1.5;max-width:820px;min-height:150px;padding:0 30px;text-shadow:3px 3px 0 #300}
  #introGo{font-size:24px;margin-top:44px;opacity:0;animation:pulse 1.6s infinite;color:#ffb0a0;transition:opacity 1s}
  #introGo.show{opacity:1}
  @keyframes pulse{50%{opacity:.3}}
  #deathOv{position:fixed;inset:0;z-index:22;background:rgba(30,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#ff6050;pointer-events:auto;cursor:pointer}
  #deathOv h1{font-size:60px;letter-spacing:12px;margin:0;text-shadow:4px 4px 0 #300;animation:gl .1s steps(2) infinite}
  #deathOv .ds{font-size:20px;margin-top:16px;color:#d8a090}
  #deathOv .click{font-size:18px;margin-top:34px;color:#ffb0a0;animation:pulse 1.6s infinite}
  @keyframes gl{0%{transform:translate(0,0)}50%{transform:translate(4px,-3px)}100%{transform:translate(-4px,2px)}}
  #pause{position:fixed;inset:0;z-index:24;background:rgba(10,0,0,.85);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:#e8c8c0}
  #pause.on{display:flex}
  #pause h2{font-size:44px;letter-spacing:14px;color:#e8b0a0;text-shadow:4px 4px 0 #300;margin-bottom:10px}
  #pause .pHint{font-size:16px;letter-spacing:3px;color:#8a6060;margin-bottom:30px}
  #pause .pBtn{background:#150505;border:2px solid #e8c8c0;color:#e8c8c0;font-family:inherit;font-size:22px;letter-spacing:5px;padding:13px 40px;cursor:pointer;margin:7px 0;min-width:280px;pointer-events:auto}
  #pause .pBtn:hover{background:#e8c8c0;color:#200505}
</style>
</head>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const TAU=Math.PI*2;
const lerpAng=(a,b,t)=>{let d=(b-a)%TAU;if(d>Math.PI)d-=TAU;if(d<-Math.PI)d+=TAU;return a+d*Math.min(1,t);};

let scene,camera,renderer;
const PS1_SCALE=0.34;
function ps1Size(){const w=innerWidth,h=innerHeight;return[Math.max(320,w*PS1_SCALE|0),Math.max(180,h*PS1_SCALE|0)];}
scene=new THREE.Scene();
scene.background=new THREE.Color(0x1a0505);
scene.fog=new THREE.FogExp2(0x2a0808,0.016);
camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,200);
camera.rotation.order='YXZ';
scene.add(camera);
renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(1);
renderer.domElement.id='game';
document.body.prepend(renderer.domElement);
function onResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  const[iw,ih]=ps1Size();renderer.setSize(iw,ih,false);
  const c=renderer.domElement;c.style.width='100vw';c.style.height='100vh';
}
addEventListener('resize',onResize);onResize();

function ps1(m,jit=140){
  m.onBeforeCompile=s=>{
    s.vertexShader=s.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uJit;')
      .replace('#include <project_vertex>',`#include <project_vertex>
        {vec4 pv=gl_Position;pv.xyz/=pv.w;pv.xy=floor(pv.xy*uJit)/uJit;pv.xyz*=pv.w;gl_Position=pv;}`);
    s.uniforms.uJit={value:jit};
  };
  return m;
}

function makeTex(sz,draw,rx,ry){
  const c=document.createElement('canvas');c.width=c.height=sz;
  draw(c.getContext('2d'),sz);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rx)t.repeat.set(rx,ry||rx);
  return t;
}
function speckle(g,s,n,cols){for(let i=0;i<n;i++){g.fillStyle=cols[Math.random()*cols.length|0];g.fillRect(Math.random()*s|0,Math.random()*s|0,1,1);}}

const texFleshGround=makeTex(64,(g,s)=>{
  g.fillStyle='#3a0a0c';g.fillRect(0,0,s,s);
  speckle(g,s,700,['#480d10','#2e070a','#541214','#240508']);
  for(let i=0;i<10;i++){g.strokeStyle='rgba(120,25,30,.45)';g.lineWidth=1;
    g.beginPath();let x=Math.random()*s,y=Math.random()*s;g.moveTo(x,y);
    for(let k=0;k<4;k++){x+=rnd(-14,14);y+=rnd(-14,14);g.lineTo(x,y);}g.stroke();}
  for(let i=0;i<6;i++){g.fillStyle='rgba(15,3,5,.5)';
    g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(2,6),0,7);g.fill();}
},24,24);

const texLava=makeTex(64,(g,s)=>{
  g.fillStyle='#c8450f';g.fillRect(0,0,s,s);
  speckle(g,s,600,['#e86a14','#f09018','#a83808','#ffd040']);
  for(let i=0;i<8;i++){g.fillStyle='rgba(60,15,5,.5)';
    g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(2,7),0,7);g.fill();}
  for(let i=0;i<5;i++){g.strokeStyle='rgba(255,220,90,.7)';g.lineWidth=2;
    g.beginPath();let x=Math.random()*s,y=Math.random()*s;g.moveTo(x,y);
    for(let k=0;k<3;k++){x+=rnd(-16,16);y+=rnd(-16,16);g.lineTo(x,y);}g.stroke();}
},3,3);

function fleshTex(base,vein,reps){
  return makeTex(64,(g,s)=>{
    g.fillStyle=base;g.fillRect(0,0,s,s);
    speckle(g,s,600,[vein,'#2a0608','#4a0f12']);
    for(let i=0;i<12;i++){g.strokeStyle='rgba(150,35,40,.4)';g.lineWidth=1;
      g.beginPath();let x=Math.random()*s,y=Math.random()*s;g.moveTo(x,y);
      for(let k=0;k<4;k++){x+=rnd(-16,16);y+=rnd(-16,16);g.lineTo(x,y);}g.stroke();}
    for(let i=0;i<4;i++){g.fillStyle='rgba(20,4,6,.6)';
      g.beginPath();g.ellipse(rnd(0,s),rnd(0,s),rnd(3,7),rnd(2,4),rnd(0,3),0,7);g.fill();}
    for(let i=0;i<3;i++){g.fillStyle='rgba(220,180,160,.15)';
      g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(2,4),0,7);g.fill();}
  },reps,reps);
}
const texFleshWall=fleshTex('#4a0d10','#5c1418',2);
const texFleshBuild=fleshTex('#3c0a0c','#501014',3);
const texFleshCeil=fleshTex('#33080a','#451014',3);

const texSky=makeTex(64,(g,s)=>{
  const gr=g.createLinearGradient(0,0,0,s);
  gr.addColorStop(0,'#1a0304');gr.addColorStop(.4,'#3c0a0a');
  gr.addColorStop(.75,'#5c1410');gr.addColorStop(1,'#7a2414');
  g.fillStyle=gr;g.fillRect(0,0,s,s);
  speckle(g,s,120,['#4a0e0e','#2a0505']);
});

const texBloodPool=makeTex(64,(g,s)=>{
  g.fillStyle='#5a0d0e';g.fillRect(0,0,s,s);
  speckle(g,s,500,['#6a0f10','#4a0808','#7a1414','#3a0505']);
  for(let i=0;i<8;i++){g.fillStyle='rgba(140,25,25,.4)';
    g.beginPath();g.arc(rnd(0,s),rnd(0,s),rnd(2,6),0,7);g.fill();}
},8,8);

scene.add(new THREE.AmbientLight(0x5c1818,0.8));
const hellL=new THREE.DirectionalLight(0xc04030,0.5);hellL.position.set(20,50,-30);scene.add(hellL);
const playerL=new THREE.PointLight(0xff6050,0.7,16,2);scene.add(playerL);
const pulseL=new THREE.PointLight(0xff3020,0.4,40,2);scene.add(pulseL);

const colliders=[];
function addCol(x1,z1,x2,z2){colliders.push({x1,z1,x2,z2});}
function collide(px,pz,r){
  for(let i=0;i<colliders.length;i++){const c=colliders[i];
    if(px<c.x1-r||px>c.x2+r||pz<c.z1-r||pz>c.z2+r)continue;
    const cx=Math.max(c.x1,Math.min(px,c.x2)),cz=Math.max(c.z1,Math.min(pz,c.z2));
    let dx=px-cx,dz=pz-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){if(d2<1e-8){dx=1;dz=0;d2=1;}
      const d=Math.sqrt(d2);px+=dx*(r-d)/d;pz+=dz*(r-d)/d;}}
  return[px,pz];
}
function box(w,h,d,mat,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);scene.add(m);return m;}

const LAVA_END=85,CITY_END=255;

let sky;
{
  sky=new THREE.Mesh(new THREE.SphereGeometry(150,20,14),
    new THREE.MeshBasicMaterial({map:texSky,side:THREE.BackSide,fog:false}));
  sky.position.set(0,0,5);scene.add(sky);
}

const groundLava=new THREE.Mesh(new THREE.PlaneGeometry(130,90),ps1(new THREE.MeshLambertMaterial({map:texFleshGround})));
groundLava.rotation.x=-Math.PI/2;groundLava.position.set(0,0,45);scene.add(groundLava);

const lavaLakes=[];
function addLake(x,z,r){
  const m=new THREE.Mesh(new THREE.CircleGeometry(r,10),
    new THREE.MeshBasicMaterial({map:texLava}));
  m.rotation.x=-Math.PI/2;m.position.set(x,0.02,z);m.renderOrder=1;scene.add(m);
  lavaLakes.push({x,z,r,mesh:m});
}
addLake(-18,20,7);addLake(16,32,8);addLake(-8,52,6);addLake(24,58,7);
addLake(-26,68,7);addLake(6,74,5);addLake(30,16,6);addLake(-30,40,6);

const geysers=[];
function addGeyser(x,z){
  const geo=new THREE.CylinderGeometry(0.5,1.1,1,7);
  const mat=new THREE.MeshBasicMaterial({map:texLava,transparent:true,opacity:0.95});
  const m=new THREE.Mesh(geo,mat);m.position.set(x,-2,z);m.visible=false;scene.add(m);
  const gl=new THREE.PointLight(0xff6020,0,12,2);gl.position.set(x,1,z);scene.add(gl);
  geysers.push({x,z,mesh:m,light:gl,t:rnd(2,6),active:false,phase:0});
}
lavaLakes.forEach(l=>{addGeyser(l.x+rnd(-2,2),l.z+rnd(-2,2));});
addGeyser(0,45);addGeyser(-15,60);

{
  const rockMat=ps1(new THREE.MeshLambertMaterial({color:0x2a0505}));
  for(let i=0;i<26;i++){
    const x=rnd(-55,55),z=rnd(8,82),s=rnd(1,2.6);
    let bad=false;
    for(const l of lavaLakes)if(Math.hypot(x-l.x,z-l.z)<l.r+1.5)bad=true;
    if(bad)continue;
    const r=new THREE.Mesh(new THREE.DodecahedronGeometry(s,0),rockMat);
    r.position.set(x,s*0.5,z);r.rotation.set(rnd(0,3),rnd(0,3),rnd(0,3));scene.add(r);
    addCol(x-s*0.7,z-s*0.7,x+s*0.7,z+s*0.7);
  }
}

const groundCity=new THREE.Mesh(new THREE.PlaneGeometry(130,175),ps1(new THREE.MeshLambertMaterial({map:texFleshGround})));
groundCity.rotation.x=-Math.PI/2;groundCity.position.set(0,0,170);scene.add(groundCity);

const CELL=22,CSH=8;
const matFleshBuild=ps1(new THREE.MeshLambertMaterial({map:texFleshBuild}));
const matFleshRoof=ps1(new THREE.MeshLambertMaterial({map:texFleshCeil}));
const matFleshWalk=ps1(new THREE.MeshLambertMaterial({map:texFleshWall}));

const CITY_Z0=90;
for(let gz=0;gz<7;gz++)for(let gx=-1;gx<=1;gx++){
  const bx=gx*CELL, bz=CITY_Z0+gz*CELL+8;
  if(gx===0){continue;}
  const w=rnd(8,12),d=rnd(8,12),h=rnd(6,16);
  const ox=rnd(-1,1),oz=rnd(-1,1);
  const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[matFleshBuild,matFleshBuild,matFleshRoof,matFleshRoof,matFleshBuild,matFleshBuild]);
  b.position.set(bx+ox,h/2,bz+oz);scene.add(b);
  addCol(bx+ox-w/2,bz+oz-d/2,bx+ox+w/2,bz+oz+d/2);
  if(Math.random()<0.5){
    const t=new THREE.Mesh(new THREE.ConeGeometry(0.4,rnd(1.5,3),5),matFleshBuild);
    t.position.set(bx+ox+rnd(-w/3,w/3),h+rnd(0.5,1.5),bz+oz+rnd(-d/3,d/3));
    t.rotation.x=rnd(-0.3,0.3);t.rotation.z=rnd(-0.3,0.3);scene.add(t);
  }
}

const carCols=[0x4a1010,0x3a0c0c,0x5a1818,0x2e0808,0x401010];
function makeStuckCar(x,z,ry){
  const g=new THREE.Group();
  const bodyM=ps1(new THREE.MeshLambertMaterial({color:carCols[Math.random()*carCols.length|0]}));
  const glass=ps1(new THREE.MeshLambertMaterial({color:0x14060a}));
  const wm=ps1(new THREE.MeshLambertMaterial({color:0x0c0404}));
  const body=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.5,4.0),bodyM);body.position.y=0.45;g.add(body);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.42,1.9),glass);cab.position.set(0,0.9,-0.2);g.add(cab);
  [[-0.85,1.3],[0.85,1.3],[-0.85,-1.3],[0.85,-1.3]].forEach(p=>{
    const w=new THREE.Mesh(new THREE.BoxGeometry(0.25,0.3,0.6),wm);w.position.set(p[0],0.28,p[1]);g.add(w);});
  g.position.set(x,-0.9,z);
  g.rotation.y=ry;
  g.rotation.x=rnd(-0.7,0.7);
  g.rotation.z=rnd(-0.6,0.6);
  scene.add(g);
  addCol(x-1.2,z-1.2,x+1.2,z+1.2);
}
for(let i=0;i<10;i++){
  const side=Math.random()<0.5?-1:1;
  makeStuckCar(side*rnd(3,6),rnd(CITY_Z0+8,CITY_END-10),rnd(0,TAU));
}

const lampMat=ps1(new THREE.MeshLambertMaterial({color:0x3a0a0c}));
const lampHead=new THREE.MeshBasicMaterial({color:0xff6040});
function fleshLamp(x,z){
  box(0.14,3.4,0.14,lampMat,x,1.7,z);
  const h=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.16,0.3),lampHead);
  h.position.set(x+0.22,3.4,z);scene.add(h);
  const l=new THREE.PointLight(0xff5030,0.6,14,2);l.position.set(x+0.2,3.2,z);scene.add(l);
}
fleshLamp(-4,CITY_Z0+10);fleshLamp(4,CITY_Z0+40);fleshLamp(-4,CITY_Z0+70);
fleshLamp(4,CITY_Z0+100);fleshLamp(-4,CITY_Z0+130);

const MAZE_COLS=9,MAZE_ROWS=9,CELL_S=9,ROOM_H=6;
const MAZE_Z0=CITY_END;
const MAZE_W=MAZE_COLS*CELL_S;
const MAZE_D=MAZE_ROWS*CELL_S;
const MAZE_END=MAZE_Z0+MAZE_D;
const ENTER_COL=Math.floor(MAZE_COLS/2);

const matMazeWall=ps1(new THREE.MeshLambertMaterial({map:texFleshWall}));
const matMazeFloor=ps1(new THREE.MeshLambertMaterial({map:texFleshGround}));
const matMazeCeil=ps1(new THREE.MeshLambertMaterial({map:texFleshCeil}));

function generateMaze(cols,rows){
  const cells=[];
  for(let r=0;r<rows;r++){cells[r]=[];
    for(let c=0;c<cols;c++)cells[r][c]={walls:[true,true,true,true],visited:false};}
  const stack=[];
  let cur={r:0,c:0};
  cells[0][0].visited=true;
  let visited=1;const total=cols*rows;
  while(visited<total){
    const nb=[];
    const {r,c}=cur;
    if(r>0&&!cells[r-1][c].visited)nb.push({r:r-1,c:c,dir:0});
    if(c<cols-1&&!cells[r][c+1].visited)nb.push({r:r,c:c+1,dir:1});
    if(r<rows-1&&!cells[r+1][c].visited)nb.push({r:r+1,c:c,dir:2});
    if(c>0&&!cells[r][c-1].visited)nb.push({r:r,c:c-1,dir:3});
    if(nb.length>0){
      const nx=nb[Math.floor(Math.random()*nb.length)];
      cells[r][c].walls[nx.dir]=false;
      cells[nx.r][nx.c].walls[[2,3,0,1][nx.dir]]=false;
      stack.push(cur);
      cur={r:nx.r,c:nx.c};
      cells[nx.r][nx.c].visited=true;
      visited++;
    }else if(stack.length>0){cur=stack.pop();}
  }
  return cells;
}

let entranceCol=null;
let mazeEntered=false;

function buildMaze(){
  const cells=generateMaze(MAZE_COLS,MAZE_ROWS);
  cells[0][ENTER_COL].walls[0]=false;

  const totalW=MAZE_W;
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(totalW,MAZE_D),matMazeFloor);
  fl.rotation.x=-Math.PI/2;fl.position.set(0,0,MAZE_Z0+MAZE_D/2);scene.add(fl);
  const cl=new THREE.Mesh(new THREE.PlaneGeometry(totalW,MAZE_D),matMazeCeil);
  cl.rotation.x=Math.PI/2;cl.position.set(0,ROOM_H,MAZE_Z0+MAZE_D/2);scene.add(cl);

  function wallH(cx,cz){
    box(CELL_S+0.4,ROOM_H,0.4,matMazeWall,cx,ROOM_H/2,cz);
    addCol(cx-CELL_S/2-0.2,cz-0.25,cx+CELL_S/2+0.2,cz+0.25);
  }
  function wallV(cx,cz){
    box(0.4,ROOM_H,CELL_S+0.4,matMazeWall,cx,ROOM_H/2,cz);
    addCol(cx-0.25,cz-CELL_S/2-0.2,cx+0.25,cz+CELL_S/2+0.2);
  }

  for(let r=0;r<MAZE_ROWS;r++){
    for(let c=0;c<MAZE_COLS;c++){
      const xLeft=c*CELL_S-totalW/2;
      const zTop=MAZE_Z0+r*CELL_S;
      const cx=xLeft+CELL_S/2, cz=zTop+CELL_S/2;
      const w=cells[r][c].walls;
      if(w[0])wallH(cx,zTop);
      if(w[3])wallV(xLeft,cz);

let AC=null,master;
function noiseBuf(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function env(g,a,peak,dec){const t=AC.currentTime;g.gain.setValueAtTime(0.0001,t);
  g.gain.linearRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(0.0001,t+a+dec);}
function initAudio(){
  if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.8;master.connect(AC.destination);
  const o=AC.createOscillator();o.type='sine';o.frequency.value=42;
  const og=AC.createGain();og.gain.value=0.06;o.connect(og);og.connect(master);o.start();
  const w=AC.createBufferSource();w.buffer=noiseBuf(3);w.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=250;
  const wg=AC.createGain();wg.gain.value=0.04;
  w.connect(f);f.connect(wg);wg.connect(master);w.start();
  const s=AC.createOscillator();s.type='triangle';s.frequency.value=280;
  const lfo=AC.createOscillator();lfo.type='sine';lfo.frequency.value=0.15;
  const lg=AC.createGain();lg.gain.value=120;lfo.connect(lg);lg.connect(s.frequency);
  const sg=AC.createGain();sg.gain.value=0.012;
  s.connect(sg);sg.connect(master);s.start();lfo.start();
}
function sndStep(){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf(0.08);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=400+Math.random()*120;
  const g=AC.createGain();env(g,0.006,0.06,0.08);s.connect(f);f.connect(g);g.connect(master);s.start();}
function sndDemon(){if(!AC)return;const o=AC.createOscillator();o.type='sawtooth';
  const f0=rnd(120,220),t=AC.currentTime;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*2.4,t+0.5);
  const g=AC.createGain();env(g,0.05,0.1,0.6);o.connect(g);g.connect(master);o.start();o.stop(t+0.8);}
function sndScream(){if(!AC)return;const o=AC.createOscillator();o.type='sawtooth';
  const f0=rnd(500,900),t=AC.currentTime;
  o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f0*0.3,t+0.7);
  const g=AC.createGain();env(g,0.03,0.18,0.7);o.connect(g);g.connect(master);o.start();o.stop(t+0.9);}
function sndMonster(){
  if(!AC)return;
  const t=AC.currentTime;
  for(let i=0;i<3;i++){
    const o=AC.createOscillator();
    o.type=(i===0)?'sawtooth':'square';
    const f0=rnd(220,520);
    const st=t+i*0.04;
    o.frequency.setValueAtTime(f0,st);
    o.frequency.exponentialRampToValueAtTime(f0*rnd(0.28,0.5),st+rnd(0.45,0.7));
    const vib=AC.createOscillator();vib.type='sine';vib.frequency.value=rnd(6,13);
    const vg=AC.createGain();vg.gain.value=rnd(25,70);
    vib.connect(vg);vg.connect(o.frequency);
    const g=AC.createGain();env(g,0.02,0.07,0.65);
    o.connect(g);g.connect(master);
    o.start(st);o.stop(st+0.75);
    vib.start(st);vib.stop(st+0.75);
  }
  const s=AC.createBufferSource();s.buffer=noiseBuf(0.6);
  const f=AC.createBiquadFilter();f.type='bandpass';f.frequency.value=rnd(300,650);f.Q.value=2;
  const g=AC.createGain();env(g,0.03,0.06,0.5);
  s.connect(f);f.connect(g);g.connect(master);s.start();
}
function sndGeyser(){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf(0.7);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=900;
  const g=AC.createGain();env(g,0.05,0.3,0.7);s.connect(f);f.connect(g);g.connect(master);s.start();}
function sndDeath(){if(!AC)return;const t=AC.currentTime;
  const o=AC.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(30,t+0.6);
  const g=AC.createGain();g.gain.setValueAtTime(0.6,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.7);
  o.connect(g);g.connect(master);o.start();o.stop(t+0.8);
  const s=AC.createBufferSource();s.buffer=noiseBuf(0.4);
  const ng=AC.createGain();ng.gain.setValueAtTime(0.5,t);ng.gain.exponentialRampToValueAtTime(0.0001,t+0.4);
  s.connect(ng);ng.connect(master);s.start();}
function sndFlood(){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf(1.5);s.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  const g=AC.createGain();g.gain.value=0.05;s.connect(f);f.connect(g);g.connect(master);s.start();}
function sndWallSlam(){if(!AC)return;const t=AC.currentTime;
  const s=AC.createBufferSource();s.buffer=noiseBuf(0.3);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=200;
  const g=AC.createGain();env(g,0.01,0.4,0.3);s.connect(f);f.connect(g);g.connect(master);s.start();}

function updatePlayer(dt){
  let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  let iz=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  const fx=-Math.sin(yaw),fz=-Math.cos(yaw);
  const rx=Math.cos(yaw),rz=-Math.sin(yaw);
  let wx=fx*iz+rx*ix, wz=fz*iz+rz*ix;
  const l=Math.hypot(wx,wz);
  if(l>0){wx/=l;wz/=l;}
  const sp=(keys.ShiftLeft||keys.ShiftRight)?6.2:3.8;
  let nx=px+wx*sp*dt,nz=pz+wz*sp*dt;
  let c=collide(nx,pz,PLAYER_R);nx=c[0];
  c=collide(nx,nz,PLAYER_R);nx=c[0];nz=c[1];
  nx=clamp(nx,-62,62);nz=clamp(nz,2,MAZE_END-1);
  const moved=Math.hypot(nx-px,nz-pz);
  px=nx;pz=nz;
  if(moved>0.0001){
    bob+=dt*sp*1.9;stepAcc+=moved;
    if(stepAcc>2){stepAcc=0;sndStep();}
  }
  const bobY=Math.sin(bob)*0.035*(moved>0.0001?1:0);
  camera.position.set(px,1.62+bobY,pz);
  camera.rotation.y=yaw;camera.rotation.x=pitch;
  camera.rotation.z=Math.sin(bob*0.5)*0.008*(moved>0.0001?1:0);
  playerL.position.set(px,2.2,pz);
  playerL.intensity=0.6+Math.sin(T*3)*0.1;

  if(pz<LAVA_END){
    if($('obj').textContent.indexOf('лаву')<0&&pz<80)
      setObjective("Обійду лавові озера та дістанусь города ю");
    for(const lk of lavaLakes){
      if(Math.hypot(px-lk.x,pz-lk.z)<lk.r-0.3){die("лава поглинула тебе");return;}
    }
  }else if(pz<CITY_END){
    if($('obj').textContent.indexOf('місто')<0)
      setObjective("Пройду через город плоті ю.");
  }else{
    if($('obj').textContent.indexOf('Кров ю')<0)
      setObjective("Кров паднімається ю.");
    if(!mazeEntered&&pz>MAZE_Z0+2){
      mazeEntered=true;
      entranceCol={x1:-CELL_S/2,z1:MAZE_Z0-0.8,x2:CELL_S/2,z2:MAZE_Z0+0.8};
      colliders.push(entranceCol);
      sndWallSlam();
      sub("Вихода нєт ю.",4);
      sndFlood();
    }
  }
}

function updateGeysers(dt){
  for(const gy of geysers){
    gy.t-=dt;
    if(gy.active){
      gy.phase+=dt;
      const k=Math.min(1,gy.phase/0.4);
      const h=k*(1-Math.max(0,(gy.phase-1.0)/0.6))*5;
      gy.mesh.visible=true;
      gy.mesh.scale.y=Math.max(0.1,h);
      gy.mesh.position.y=h/2;
      gy.light.intensity=k*3;
      if(Math.hypot(px-gy.x,pz-gy.z)<2.2&&h>1){die("гейзер лави накрив меня ю.");return;}
      if(gy.phase>1.6){gy.active=false;gy.mesh.visible=false;gy.light.intensity=0;gy.t=rnd(4,9);}
    }else if(gy.t<=0){
      gy.active=true;gy.phase=0;
      if(Math.hypot(px-gy.x,pz-gy.z)<30)sndGeyser();
    }
  }
}

function updateDemons(dt){
  for(const d of demons){
    const dp=Math.hypot(d.x-px,d.z-pz);
    if(dp<20&&pz<LAVA_END+10)d.st='chase';
    else if(dp>30)d.st='fly';
    if(d.st==='chase'){
      const ang=Math.atan2(px-d.x,pz-d.z);
      d.ang=lerpAng(d.ang,ang,dt*3);
      const sp=3.4;
      d.x+=Math.sin(d.ang)*sp*dt;
      d.z+=Math.cos(d.ang)*sp*dt;
      d.y+=((2.0)-d.y)*dt*2;
      if(dp<1.3){sndDemon();die("демон дістав меня ю.");return;}
    }else{
      d.ang+=rnd(-1,1)*dt*0.8;
      d.x+=Math.sin(d.ang)*d.sp*dt;
      d.z+=Math.cos(d.ang)*d.sp*dt;
      d.y+=Math.sin(T*1.3+d.bob)*0.5*dt;
      d.y=clamp(d.y,1.6,4.5);
      if(d.x<-55||d.x>55)d.ang+=Math.PI;
      if(d.z<5||d.z>85)d.ang+=Math.PI;
    }
    d.bob+=dt;
    d.m.g.position.set(d.x,d.y+Math.sin(d.bob*2)*0.3,d.z);
    d.m.g.rotation.y=d.ang;
    const flap=Math.sin(d.bob*9)*0.7;
    d.m.wingL.rotation.z=flap;
    d.m.wingR.rotation.z=-flap;
  }
}

function updateMonsters(dt){
  for(const mo of monsters){
    mo.t+=dt;
    if(mo.screamCd>0)mo.screamCd-=dt;
    const dp=Math.hypot(mo.x-px,mo.z-pz);
    if(dp<14&&pz>CITY_Z0-4&&pz<CITY_END+4)mo.st='chase';
    else if(dp>22)mo.st='wander';
    let sp;
    if(mo.st==='chase'){
      mo.ang=Math.atan2(px-mo.x,pz-mo.z)+Math.sin(mo.t*4)*0.2;
      sp=3.2;
      if(mo.screamCd<=0){sndMonster();mo.screamCd=rnd(2.5,5);}
      if(dp<1.2){sndScream();die("подоба дістала мебе ю.");return;}
    }else{
      mo.timer-=dt;
      if(mo.timer<=0){mo.ang=rnd(0,TAU);mo.timer=rnd(2,5);}
      sp=mo.sp;
    }
    const dx=Math.sin(mo.ang),dz=Math.cos(mo.ang);
    let nx=mo.x+dx*sp*dt,nz=mo.z+dz*sp*dt;
    nx=clamp(nx,-10,10);nz=clamp(nz,CITY_Z0+4,CITY_END-4);
    const c=collide(nx,nz,0.3);nx=c[0];nz=c[1];
    if(Math.hypot(nx-mo.x,nz-mo.z)<sp*dt*0.3){mo.ang+=Math.PI/2+rnd(-0.5,0.5);}
    mo.x=nx;mo.z=nz;
    mo.m.g.position.set(mo.x,Math.abs(Math.sin(mo.t*sp*3))*0.05,mo.z);
    mo.m.g.rotation.y=lerpAng(mo.m.g.rotation.y,mo.ang+Math.PI,dt*8);
    const sw=Math.sin(mo.t*sp*3)*(mo.st==='chase'?1.0:0.5);
    mo.m.legL.rotation.x=sw;mo.m.legR.rotation.x=-sw;
    if(mo.m.legM)mo.m.legM.rotation.x=Math.sin(mo.t*sp*3+2)*0.5;
    mo.m.armL.rotation.x=mo.st==='chase'?-2.2+Math.sin(mo.t*10)*0.3:-sw;
    mo.m.armR.rotation.x=mo.st==='chase'?-2.2-Math.sin(mo.t*10)*0.3:sw;
    if(mo.m.armM)mo.m.armM.rotation.x=Math.sin(mo.t*7)*0.8;
  }
}

function updateFlood(dt){
  if(mazeEntered&&state==='play'){
    bloodLevel+=dt*0.5;
    if(bloodLevel>=1.5&&!deepBloodShown){
      deepBloodShown=true;
      $('deepBlood').style.opacity=1;
      sub("Кров в горлі ю",3);
    }
    if(bloodLevel>=2.2){
      state='done';
      mazeEntered=false;
      $('bloodOv').style.background='rgba(90,0,0,1)';
      $('deepBlood').style.opacity=1;
      setTimeout(()=>{window.location.href='hell2.html';},1800);
      return;
    }
  }
  bloodFill.position.y=bloodLevel;
  const danger=clamp((bloodLevel-1)/1.2,0,1);
  $('bloodOv').style.background='rgba(90,0,0,'+(danger*0.45)+')';
}

function updatePulse(dt){
  pulseT+=dt;
  const p=0.5+Math.sin(pulseT*1.4)*0.3;
  pulseL.intensity=p*0.5;
  pulseL.position.set(px,3,pz+8);
  hellL.intensity=0.4+Math.sin(pulseT*1.1)*0.08;
}

function updateSky(){
  sky.position.x=camera.position.x;
  sky.position.z=camera.position.z;
}

const nzC=$('noiseC'),ng=nzC.getContext('2d');
function drawNoise(){
  const id=ng.createImageData(128,72),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  ng.putImageData(id,0,0);
}

camera.position.set(0,1.62,5);
camera.rotation.y=Math.PI;
startTyping();
let last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min(0.05,(now-last)/1000);last=now;

  drawNoise();

  if(state==='intro'){
    T+=dt;
    camera.position.set(0,1.62,5);
    camera.rotation.y=Math.PI+Math.sin(T*0.3)*0.1;
    camera.rotation.x=0;
    updatePulse(dt);
    updateGeysers(dt);
    updateDemons(dt);
    updateSky();
    renderer.render(scene,camera);
    return;
  }

  if(!paused){
    T+=dt;
    if(subT>0){subT-=dt;if(subT<=0)$('sub').style.opacity=0;}
    updatePulse(dt);

    if(state==='play'){
      updatePlayer(dt);
      if(state==='play'){
        updateGeysers(dt);
        updateDemons(dt);
        updateMonsters(dt);
        updateFlood(dt);
      }
    }else if(state==='dead'){
      deadT+=dt;
    }
  }

  updateSky();
  renderer.render(scene,camera);
}
loop();
</script>
</body>
