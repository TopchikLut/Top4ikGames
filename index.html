<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ТОП4ІК GAMES</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'VT323','Courier New',monospace;user-select:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:default}
  #game.grabbing{cursor:grabbing}
  #game.pointer{cursor:pointer}
  #noiseC{position:fixed;inset:0;width:100vw;height:100vh;opacity:.08;pointer-events:none;z-index:5;mix-blend-mode:screen}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.85) 100%)}
  
  #playBtn{position:fixed;font-family:inherit;font-size:32px;padding:10px 30px;background:rgba(10,26,10,.9);color:#0f0;border:3px solid #0f0;cursor:pointer;letter-spacing:6px;z-index:10;opacity:0;pointer-events:none;transition:opacity .8s;box-shadow:0 0 20px rgba(0,255,0,.4),inset 0 0 10px rgba(0,255,0,.1);text-shadow:0 0 8px #0f0}
  #playBtn.show{opacity:1;pointer-events:auto}
  #playBtn:hover{background:#0f0;color:#0a1a0a;box-shadow:0 0 40px rgba(0,255,0,.8)}
  
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:12;transition:opacity 1.5s}
  
  #hint{position:fixed;bottom:12%;left:50%;transform:translateX(-50%);font-size:24px;color:#8a8;text-shadow:2px 2px 0 #000;z-index:8;opacity:0;transition:opacity 1s;text-align:center}
  #hint.show{opacity:1}
</style>
</head>
<body>

<canvas id="noiseC" width="128" height="72"></canvas>
<div id="scan"></div><div id="vig"></div>
<button id="playBtn">PLAY</button>
<div id="hint">Візьми дискету і встав її у компютер ю.</div>
<div id="fade"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

let scene,camera,renderer;
const PS1_SCALE=0.34;
function ps1Size(){const w=innerWidth,h=innerHeight;return[Math.max(320,w*PS1_SCALE|0),Math.max(180,h*PS1_SCALE|0)];}
scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a12);
scene.fog=new THREE.FogExp2(0x0a0a12,0.06);

camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
const CAM_START={x:0,y:7.5,z:11};
const CAM_END={x:0,y:3.8,z:6.5};
camera.position.set(CAM_START.x,CAM_START.y,CAM_START.z);
camera.lookAt(0,1.2,0);
scene.add(camera);

renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(1);
renderer.domElement.id='game';
document.body.prepend(renderer.domElement);
function onResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  const[iw,ih]=ps1Size();renderer.setSize(iw,ih,false);
  const c=renderer.domElement;c.style.width='100vw';c.style.height='100vh';
}
addEventListener('resize',onResize);onResize();

function ps1(m,jit=120){
  m.onBeforeCompile=s=>{
    s.vertexShader=s.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uJit;')
      .replace('#include <project_vertex>',`#include <project_vertex>
        {vec4 pv=gl_Position;pv.xyz/=pv.w;pv.xy=floor(pv.xy*uJit)/uJit;pv.xyz*=pv.w;gl_Position=pv;}`);
    s.uniforms.uJit={value:jit};
  };
  return m;
}

function makeTex(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  return t;
}

const texScreenOff=makeTex(256,192,(g,w,h)=>{
  g.fillStyle='#050a05';g.fillRect(0,0,w,h);
  const grad=g.createRadialGradient(w/2,h/2,w*0.05,w/2,h/2,w*0.55);
  grad.addColorStop(0,'rgba(0,25,0,.8)');
  grad.addColorStop(1,'rgba(0,8,0,.95)');
  g.fillStyle=grad;g.fillRect(0,0,w,h);
  
  g.strokeStyle='rgba(0,80,0,.1)';g.lineWidth=1;
  for(let y=0;y<h;y+=4){
    g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();
  }
});

const texScreenOn=makeTex(256,192,(g,w,h)=>{
  g.fillStyle='#0a3a0a';g.fillRect(0,0,w,h);
  const grad=g.createRadialGradient(w/2,h/2,w*0.1,w/2,h/2,w*0.55);
  grad.addColorStop(0,'rgba(0,90,0,.95)');
  grad.addColorStop(1,'rgba(0,30,0,.95)');
  g.fillStyle=grad;g.fillRect(0,0,w,h);
  
  g.strokeStyle='rgba(0,255,0,.2)';g.lineWidth=1;
  for(let y=0;y<h;y+=3){
    g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();
  }
  
  g.fillStyle='#0f0';g.font='bold 28px "Courier New",monospace';g.textAlign='center';
  g.fillText('ТОП4ІК GAMES',w/2,h/2-20);
});

const texFloppyLabel=makeTex(128,64,(g,w,h)=>{
  g.fillStyle='#d8d0c0';g.fillRect(0,0,w,h);
  g.strokeStyle='#8a7060';g.lineWidth=2;g.strokeRect(4,4,w-8,h-8);
  g.fillStyle='#2a1810';g.font='bold 16px "Courier New",monospace';g.textAlign='center';
  g.fillText('ТОП4ІК',w/2,26);
  g.fillText('GAMES',w/2,46);
});

const texKeyboard=makeTex(128,64,(g,w,h)=>{
  g.fillStyle='#c8c0b0';g.fillRect(0,0,w,h);
  for(let row=0;row<4;row++){
    for(let col=0;col<10;col++){
      const kx=8+col*12;
      const ky=6+row*13;
      g.fillStyle='#a8a090';g.fillRect(kx,ky,10,10);
      g.fillStyle='#888070';g.fillRect(kx,ky+8,10,2);
    }
  }
});

scene.add(new THREE.AmbientLight(0x1a1a28,0.5));
const mainLight=new THREE.PointLight(0xffd0a0,1.0,15,2);
mainLight.position.set(0,6,4);
scene.add(mainLight);
const screenLight=new THREE.PointLight(0x00ff00,0.4,6,2);
screenLight.position.set(0,2.2,1.5);
scene.add(screenLight);

const deskGroup=new THREE.Group();
scene.add(deskGroup);

const desk=new THREE.Mesh(
  new THREE.BoxGeometry(8,0.35,4),
  ps1(new THREE.MeshLambertMaterial({color:0x5a4030}))
);
desk.position.y=-0.175;
deskGroup.add(desk);

const deskLegMat=ps1(new THREE.MeshLambertMaterial({color:0x4a3020}));
[[-3.7,0,-1.7],[3.7,0,-1.7],[-3.7,0,1.7],[3.7,0,1.7]].forEach(p=>{
  const leg=new THREE.Mesh(new THREE.BoxGeometry(0.18,3,0.18),deskLegMat);
  leg.position.set(p[0],-1.85,p[2]);
  deskGroup.add(leg);
});

const monitorGroup=new THREE.Group();
monitorGroup.position.set(0,0,0);
scene.add(monitorGroup);

const monitorBody=new THREE.Mesh(
  new THREE.BoxGeometry(2.6,2.8,2.4),
  ps1(new THREE.MeshLambertMaterial({color:0xd8d0c0}))
);
monitorBody.position.set(0,1.7,0);
monitorGroup.add(monitorBody);

const monitorBack=new THREE.Mesh(
  new THREE.BoxGeometry(2.2,2.4,0.9),
  ps1(new THREE.MeshLambertMaterial({color:0xc8c0b0}))
);
monitorBack.position.set(0,1.8,-1.4);
monitorGroup.add(monitorBack);

const monitorBase=new THREE.Mesh(
  new THREE.CylinderGeometry(0.6,0.7,0.4,8),
  ps1(new THREE.MeshLambertMaterial({color:0xc0b8a8}))
);
monitorBase.position.set(0,0.2,0);
monitorGroup.add(monitorBase);

const screenFrame=new THREE.Mesh(
  new THREE.BoxGeometry(2.3,2.0,0.14),
  ps1(new THREE.MeshLambertMaterial({color:0x1a1a1a}))
);
screenFrame.position.set(0,1.85,1.14);
monitorGroup.add(screenFrame);

const screenMat=ps1(new THREE.MeshLambertMaterial({map:texScreenOff,emissive:0x001500,emissiveIntensity:0.3}));
const screen=new THREE.Mesh(
  new THREE.PlaneGeometry(2.0,1.7),
  screenMat
);
screen.position.set(0,1.85,1.22);
monitorGroup.add(screen);

const floppySlotGroup=new THREE.Group();
floppySlotGroup.position.set(0.85,0.65,1.21);
monitorGroup.add(floppySlotGroup);

const floppySlot=new THREE.Mesh(
  new THREE.BoxGeometry(0.65,0.07,0.05),
  ps1(new THREE.MeshLambertMaterial({color:0x020202}))
);
floppySlotGroup.add(floppySlot);

const slotFrameMat=ps1(new THREE.MeshLambertMaterial({color:0x7a7268}));
const slotFrameTop=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.03,0.06),slotFrameMat);
slotFrameTop.position.y=0.05;
floppySlotGroup.add(slotFrameTop);

const slotFrameBottom=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.03,0.06),slotFrameMat);
slotFrameBottom.position.y=-0.05;
floppySlotGroup.add(slotFrameBottom);

const slotFrameLeft=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.13,0.06),slotFrameMat);
slotFrameLeft.position.x=-0.34;
floppySlotGroup.add(slotFrameLeft);

const slotFrameRight=new THREE.Mesh(new THREE.BoxGeometry(0.03,0.13,0.06),slotFrameMat);
slotFrameRight.position.x=0.34;
floppySlotGroup.add(slotFrameRight);

const floppyGroup=new THREE.Group();
const floppyStartPos=new THREE.Vector3(2.5,0.2,1.0);
floppyGroup.position.copy(floppyStartPos);
scene.add(floppyGroup);

const floppyBody=new THREE.Mesh(
  new THREE.BoxGeometry(0.55,0.045,0.55),
  ps1(new THREE.MeshLambertMaterial({color:0x1a1a2a}))
);
floppyGroup.add(floppyBody);

const floppyLabel=new THREE.Mesh(
  new THREE.PlaneGeometry(0.38,0.22),
  new THREE.MeshLambertMaterial({map:texFloppyLabel})
);
floppyLabel.rotation.x=-Math.PI/2;
floppyLabel.position.set(0,0.028,0.1);
floppyGroup.add(floppyLabel);

const floppyMetal=new THREE.Mesh(
  new THREE.BoxGeometry(0.34,0.05,0.14),
  ps1(new THREE.MeshLambertMaterial({color:0x9a9a9a}))
);
floppyMetal.position.set(0,0,0.2);
floppyGroup.add(floppyMetal);

const floppyHole=new THREE.Mesh(
  new THREE.BoxGeometry(0.09,0.055,0.09),
  ps1(new THREE.MeshLambertMaterial({color:0x0a0a0a}))
);
floppyHole.position.set(0,0.022,0.2);
floppyGroup.add(floppyHole);

const keyboard=new THREE.Mesh(
  new THREE.BoxGeometry(2.0,0.14,0.8),
  ps1(new THREE.MeshLambertMaterial({map:texKeyboard}))
);
keyboard.position.set(-2.2,0.25,0.8);
scene.add(keyboard);

const keysMat=ps1(new THREE.MeshLambertMaterial({color:0x9a9080}));
for(let row=0;row<4;row++){
  for(let col=0;col<10;col++){
    const key=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.065,0.13),keysMat);
    key.position.set(-3.1+col*0.19,0.32+row*0.01,0.5+row*0.17);
    scene.add(key);
  }
}

const mouseGroup=new THREE.Group();
mouseGroup.position.set(-3.4,0.2,1.5);
scene.add(mouseGroup);

const mouseBody=new THREE.Mesh(
  new THREE.BoxGeometry(0.28,0.14,0.45),
  ps1(new THREE.MeshLambertMaterial({color:0xd8d0c0}))
);
mouseBody.scale.set(1,0.6,1.3);
mouseGroup.add(mouseBody);

const mouseBtn=new THREE.Mesh(
  new THREE.BoxGeometry(0.11,0.05,0.17),
  ps1(new THREE.MeshLambertMaterial({color:0xc8c0b0}))
);
mouseBtn.position.set(0,0.09,0.17);
mouseGroup.add(mouseBtn);

const mouseWire=new THREE.Mesh(
  new THREE.CylinderGeometry(0.012,0.012,0.9,6),
  ps1(new THREE.MeshLambertMaterial({color:0x4a4a4a}))
);
mouseWire.position.set(0,0,-0.55);
mouseWire.rotation.x=Math.PI/2;
mouseGroup.add(mouseWire);

let state='approaching',T=0,approachT=0,transitioning=false;
const APPROACH_DURATION=2.5;

let floppyDragging=false;
let floppyDragPlane=new THREE.Plane(new THREE.Vector3(0,1,0),-0.2);
let floppyOffset=new THREE.Vector3();
let floppyInserted=false;
let floppyAnimating=false;
let floppyAnimT=0;
let floppyStartDragPos=new THREE.Vector3();
const FLOPPY_SLOT_POS=new THREE.Vector3(0.85,0.65,1.25);
const AUTO_INSERT_DISTANCE=1.8;

const playBtnScreenPos=new THREE.Vector3(0,1.45,1.23);

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();

function getMousePos(e){
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  return mouse;
}

function updatePlayBtnPosition(){
  if(!floppyInserted)return;
  const pos=playBtnScreenPos.clone();
  pos.project(camera);
  const x=(pos.x*0.5+0.5)*innerWidth;
  const y=(-pos.y*0.5+0.5)*innerHeight;
  $('playBtn').style.left=x+'px';
  $('playBtn').style.top=y+'px';
  $('playBtn').style.transform='translate(-50%,-50%)';
}

function startInsertAnimation(){
  floppyAnimating=true;
  floppyAnimT=0;
  floppyStartDragPos.copy(floppyGroup.position);
  floppyDragging=false;
  renderer.domElement.classList.remove('grabbing');
  $('hint').classList.remove('show');
}

renderer.domElement.addEventListener('mousedown',function(e){
  if(state!=='ready'||floppyInserted||floppyAnimating)return;
  
  getMousePos(e);
  raycaster.setFromCamera(mouse,camera);
  
  const intersects=raycaster.intersectObjects([floppyBody,floppyLabel,floppyMetal,floppyHole],true);
  if(intersects.length>0){
    floppyDragging=true;
    renderer.domElement.classList.add('grabbing');
    
    const planePoint=new THREE.Vector3();
    raycaster.ray.intersectPlane(floppyDragPlane,planePoint);
    floppyOffset.copy(floppyGroup.position).sub(planePoint);
    floppyStartDragPos.copy(floppyGroup.position);
  }
});

window.addEventListener('mousemove',function(e){
  if(!floppyDragging)return;
  
  getMousePos(e);
  raycaster.setFromCamera(mouse,camera);
  
  const planePoint=new THREE.Vector3();
  if(raycaster.ray.intersectPlane(floppyDragPlane,planePoint)){
    floppyGroup.position.copy(planePoint.add(floppyOffset));
    floppyGroup.position.y=clamp(floppyGroup.position.y,0.2,2.8);
    
    const dist=floppyGroup.position.distanceTo(FLOPPY_SLOT_POS);
    if(dist<AUTO_INSERT_DISTANCE){
      startInsertAnimation();
    }
  }
});

window.addEventListener('mouseup',function(){
  if(!floppyDragging)return;
  floppyDragging=false;
  renderer.domElement.classList.remove('grabbing');
});

renderer.domElement.addEventListener('mousemove',function(e){
  if(state!=='ready'||floppyDragging||floppyInserted||floppyAnimating)return;
  
  getMousePos(e);
  raycaster.setFromCamera(mouse,camera);
  
  const intersects=raycaster.intersectObjects([floppyBody,floppyLabel,floppyMetal,floppyHole],true);
  if(intersects.length>0){
    renderer.domElement.classList.add('pointer');
  }else{
    renderer.domElement.classList.remove('pointer');
  }
});

$('playBtn').addEventListener('click',function(){
  if(transitioning)return;
  transitioning=true;
  $('fade').style.opacity=1;
  setTimeout(function(){window.location.href='0.html';},1500);
});

let AC=null,master;
function noiseBuf(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function initAudio(){
  if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
  const w=AC.createBufferSource();w.buffer=noiseBuf(3);w.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=200;
  const wg=AC.createGain();wg.gain.value=0.02;
  w.connect(f);f.connect(wg);wg.connect(master);w.start();
  const o=AC.createOscillator();o.type='sine';o.frequency.value=60;
  const og=AC.createGain();og.gain.value=0.03;o.connect(og);og.connect(master);o.start();
}
initAudio();

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

const nzC=$('noiseC'),ng=nzC.getContext('2d');
function drawNoise(){
  const id=ng.createImageData(128,72),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  ng.putImageData(id,0,0);
}

let last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  
  drawNoise();
  
  if(floppyInserted){
    screenLight.intensity=1.2+Math.sin(T*3)*0.15+Math.random()*0.08;
    updatePlayBtnPosition();
  }else{
    screenLight.intensity=0.4+Math.sin(T*2)*0.05;
  }
  
  if(state==='approaching'){
    approachT+=dt;
    const p=Math.min(1,approachT/APPROACH_DURATION);
    const ep=easeInOut(p);
    camera.position.x=CAM_START.x+(CAM_END.x-CAM_START.x)*ep;
    camera.position.y=CAM_START.y+(CAM_END.y-CAM_START.y)*ep;
    camera.position.z=CAM_START.z+(CAM_END.z-CAM_START.z)*ep;
    camera.lookAt(0,1.2,0);
    
    if(p>=1){
      state='ready';
      $('hint').classList.add('show');
    }
  }else if(state==='ready'){
    camera.position.x=CAM_END.x;
    camera.position.y=CAM_END.y;
    camera.position.z=CAM_END.z;
    camera.lookAt(0,1.2,0);
    
    if(floppyAnimating){
      floppyAnimT+=dt;
      const p=Math.min(1,floppyAnimT/1.0);
      const ep=easeInOut(p);
      
      const midPos=floppyStartDragPos.clone().lerp(FLOPPY_SLOT_POS,0.5);
      midPos.y+=0.4;
      
      if(p<0.5){
        const t=p*2;
        floppyGroup.position.lerpVectors(floppyStartDragPos,midPos,easeInOut(t));
      }else{
        const t=(p-0.5)*2;
        floppyGroup.position.lerpVectors(midPos,FLOPPY_SLOT_POS,easeInOut(t));
      }
      
      floppyGroup.rotation.x=ep*Math.PI/2;
      floppyGroup.rotation.z=lerp(floppyGroup.rotation.z,0,ep);
      floppyGroup.scale.setScalar(lerp(1,0.6,ep));
      
      if(p>=1){
        floppyAnimating=false;
        floppyInserted=true;
        floppyGroup.visible=false;
        
        screen.material=ps1(new THREE.MeshLambertMaterial({map:texScreenOn,emissive:0x006000,emissiveIntensity:0.7}));
        screen.material.needsUpdate=true;
        
        setTimeout(function(){
          $('playBtn').classList.add('show');
        },600);
      }
    }
    
    if(floppyDragging){
      const dist=floppyGroup.position.distanceTo(FLOPPY_SLOT_POS);
      if(dist<AUTO_INSERT_DISTANCE*1.3){
        floppySlot.material.color.setHex(0x00aa00);
      }else{
        floppySlot.material.color.setHex(0x020202);
      }
    }
  }
  
  renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
