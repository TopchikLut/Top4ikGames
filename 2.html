function ps1(m,jit=120){
  m.onBeforeCompile=s=>{
    s.vertexShader=s.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uJit;')
      .replace('#include <project_vertex>',`#include <project_vertex>
        {vec4 pv=gl_Position;pv.xyz/=pv.w;pv.xy=floor(pv.xy*uJit)/uJit;pv.xyz*=pv.w;gl_Position=pv;}`);
    s.uniforms.uJit={value:jit};
  };
  return m;
}

  t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rx)t.repeat.set(rx,ry||rx);

const colliders=[];
function addCol(x1,z1,x2,z2){colliders.push({x1,z1,x2,z2});}
function collide(px,pz,r){
  for(let i=0;i<colliders.length;i++){const c=colliders[i];
    if(px<c.x1-r||px>c.x2+r||pz<c.z1-r||pz>c.z2+r)continue;
    const cx=Math.max(c.x1,Math.min(px,c.x2)),cz=Math.max(c.z1,Math.min(pz,c.z2));
    let dx=px-cx,dz=pz-cz,d2=dx*dx+dz*dz;
    if(d2<r*r){
      if(d2<1e-8){dx=1;dz=0;d2=1;}
      const d=Math.sqrt(d2);px+=dx*(r-d)/d;pz+=dz*(r-d)/d;
    }}
  return[px,pz];
}

  box(0.55,0.8,0.3,ps1(new THREE.MeshLambertMaterial({color:0x6a5634})),SCX,1.45,SCZ);
  const head=new THREE.Mesh(new THREE.BoxGeometry(0.36,0.36,0.36),ps1(new THREE.MeshLambertMaterial({color:0xb09a6e})));
  head.position.set(SCX,2.1,SCZ);head.rotation.y=0.5;scene.add(head);
}

const cars=[];
function makePoliceCar(x,z,ry){
  const car=new THREE.Group();
  const white=ps1(new THREE.MeshLambertMaterial({color:0xe4e8ea}));
  const dark=ps1(new THREE.MeshLambertMaterial({color:0x161a20}));

  const body=new THREE.Mesh(new THREE.BoxGeometry(1.9,0.6,4.6),white);body.position.y=0.62;car.add(body);
  const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.94,0.18,4.62),blueM);stripe.position.y=0.48;car.add(stripe);
  const cab=new THREE.Mesh(new THREE.BoxGeometry(1.7,0.55,2.3),dark);cab.position.set(0,1.18,-0.15);car.add(cab);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(1.72,0.06,2.32),white);roof.position.set(0,1.48,-0.15);car.add(roof);
  const decM=ps1(new THREE.MeshLambertMaterial({map:tPol}));
  const dec1=new THREE.Mesh(new THREE.PlaneGeometry(1.5,0.38),decM);
  dec1.position.set(0.965,0.85,0.3);dec1.rotation.y=Math.PI/2;car.add(dec1);
  const dec2=dec1.clone();dec2.position.x=-0.965;dec2.rotation.y=-Math.PI/2;car.add(dec2);
  const wg=new THREE.CylinderGeometry(0.34,0.34,0.24,8);
  [[-0.95,1.45],[0.95,1.45],[-0.95,-1.45],[0.95,-1.45]].forEach(p=>{
    const w=new THREE.Mesh(wg,dark);w.rotation.z=Math.PI/2;w.position.set(p[0],0.34,p[1]);car.add(w);});
  const bar=new THREE.Mesh(new THREE.BoxGeometry(1.1,0.12,0.35),dark);bar.position.set(0,1.58,-0.15);car.add(bar);
  const redM=new THREE.MeshBasicMaterial({color:0xff2020});
  const bluM=new THREE.MeshBasicMaterial({color:0x2040ff});
  const lr=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.14,0.3),redM);lr.position.set(-0.28,1.62,-0.15);car.add(lr);
  const lb=new THREE.Mesh(new THREE.BoxGeometry(0.42,0.14,0.3),bluM);lb.position.set(0.28,1.62,-0.15);car.add(lb);
  const rl=new THREE.PointLight(0xff2222,0,16,2);rl.position.set(-0.5,2.0,-0.15);car.add(rl);
  const bl=new THREE.PointLight(0x2244ff,0,16,2);bl.position.set(0.5,2.0,-0.15);car.add(bl);
  const hlM=new THREE.MeshBasicMaterial({color:0xfff2c0});
  [[-0.6],[0.6]].forEach(p=>{
    const h=new THREE.Mesh(new THREE.PlaneGeometry(0.35,0.18),hlM);
    h.position.set(p[0],0.72,2.31);car.add(h);});
  car.position.set(x,0,z);car.rotation.y=ry;scene.add(car);
  cars.push({g:car,redM,bluM,rl,bl,phase:Math.random()*2});
  const hx=2.3*Math.abs(Math.sin(ry))+0.95*Math.abs(Math.cos(ry));
  const hz=2.3*Math.abs(Math.cos(ry))+0.95*Math.abs(Math.sin(ry));
  addCol(x-hx,z-hz,x+hx,z+hz);
}
makePoliceCar(1.1,-19,0.35);
makePoliceCar(-6.8,-34.5,1.15);

cone(2.4,-15.5);cone(-2.2,-17);cone(3.1,-23);
{
  const poleM=ps1(new THREE.MeshLambertMaterial({color:0x3a3a3a}));

let px=0,pz=7,yaw=0,pitch=-0.22,bob=0,stepAcc=0,locked=false;
const keys={};
const playerR=0.35;
const canControl=false;
const fwdV=new THREE.Vector3(),rightV=new THREE.Vector3(),UPV=new THREE.Vector3(0,1,0);


document.addEventListener('pointerlockchange',()=>{locked=document.pointerLockElement===renderer.domElement;});
document.addEventListener('mousemove',e=>{
  if(!locked||!canControl)return;
  yaw-=e.movementX*0.0023;pitch-=e.movementY*0.0023;
  pitch=Math.max(-1.45,Math.min(1.45,pitch));
});
document.addEventListener('keydown',e=>{
  if(!canControl)return;
  keys[e.code]=true;
});
document.addEventListener('keyup',e=>keys[e.code]=false);

function updatePlayer(dt){
  if(!canControl)return;
  let ix=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  let iz=(keys.KeyW?1:0)-(keys.KeyS?1:0);
  camera.getWorldDirection(fwdV);fwdV.y=0;fwdV.normalize();
  rightV.crossVectors(fwdV,UPV);
  let wx=0,wz=0;
  if(ix||iz){const l=Math.hypot(ix,iz);ix/=l;iz/=l;
    wx=fwdV.x*iz+rightV.x*ix;wz=fwdV.z*iz+rightV.z*ix;}
  const sp=keys.ShiftLeft?5:2.8;
  let nx=px+wx*sp*dt,nz=pz+wz*sp*dt;
  let c=collide(nx,pz,playerR);nx=c[0];
  c=collide(nx,nz,playerR);nx=c[0];nz=c[1];
  nx=Math.max(-80,Math.min(80,nx));nz=Math.max(-80,Math.min(80,nz));
  const moved=Math.hypot(nx-px,nz-pz);
  px=nx;pz=nz;
  if(moved>0.0001){bob+=dt*sp*1.9;stepAcc+=moved;
    if(stepAcc>(sp>3?2.3:1.8)){stepAcc=0;sndStep();}}
  const bobY=Math.sin(bob)*0.035*(moved>0.0001?1:0);
  camera.position.set(px,1.62+bobY,pz);
  camera.rotation.y=yaw;camera.rotation.x=pitch;
  camera.rotation.z=Math.sin(bob*0.5)*0.008*(moved>0.0001?1:0);
}

camera.position.set(px,1.62,pz);
camera.rotation.y=yaw;camera.rotation.x=pitch;

function flashCars(t){
  for(const c of cars){
    const f=(t*3+c.phase)%2;
    let r=0.04,b=0.04;
    if(f<0.9){r=(f<0.45)?1:0.12;}
    else{b=(f<1.35)?1:0.12;}
    c.rl.intensity=r*3.2;c.bl.intensity=b*3.2;
    c.redM.color.setRGB(0.15+0.85*r,0.03,0.04);
    c.bluM.color.setRGB(0.03,0.05+0.15*b,0.15+0.85*b);
  }
}

let AC=null,master,birdT=1;
function noiseBuf(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function initAudio(){
  if(AC)return;AC=new (window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.75;master.connect(AC.destination);
  const w=AC.createBufferSource();w.buffer=noiseBuf(3);w.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=500;
  const wg=AC.createGain();wg.gain.value=0.035;
  w.connect(f);f.connect(wg);wg.connect(master);w.start();
}
document.addEventListener('pointerdown',initAudio,{once:false});
function sndStep(){if(!AC)return;const s=AC.createBufferSource();s.buffer=noiseBuf(0.1);
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=420+Math.random()*160;
  const g=AC.createGain();const t=AC.currentTime;
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.1,t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001,t+0.11);
  s.connect(f);f.connect(g);g.connect(master);s.start();}
function chirp(){if(!AC)return;const t=AC.currentTime;const n=3+(Math.random()*3|0);
  for(let i=0;i<n;i++){
    const o=AC.createOscillator();o.type='sine';
    const st=t+i*rnd(0.09,0.16),f0=rnd(2200,3400);
    o.frequency.setValueAtTime(f0,st);
    o.frequency.exponentialRampToValueAtTime(f0*rnd(0.7,1.25),st+0.07);
    const g=AC.createGain();
    g.gain.setValueAtTime(0.0001,st);g.gain.linearRampToValueAtTime(rnd(0.02,0.05),st+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.09);
    o.connect(g);g.connect(master);o.start(st);o.stop(st+0.12);
  }}

const lines=[
"Пісьмо от топчіка у світу і от світа у топчіку ю.",
"Рад що ти заглянул ко мнє ія ждав тебя надіюсь що ти оцєніш мою ігру ю я фанатіл от твоіх стрімов ю і яя хотіл що ти доїднався до нас тогда мі большє не розлучаліся ю."
];
const totalLen=lines[0].length+lines[1].length;
const CPS=26,DELAY=1.6;
let typed=false;
const l1=$('l1'),l2=$('l2'),nextBtn=$('nextBtn');
nextBtn.addEventListener('click',()=>{window.location.href='3.html';});
function typewriter(T){
  if(typed)return;
  const n=Math.max(0,Math.floor((T-DELAY)*CPS));
  const a=Math.min(n,lines[0].length);
  const b=n-lines[0].length;
  const cur=((T*2|0)%2===0)?'▌':'';
  if(n<lines[0].length){
    l1.textContent=lines[0].slice(0,a)+cur;l2.textContent='';
  }else{
    l1.textContent=lines[0];
    l2.textContent=lines[1].slice(0,Math.max(0,b))+(n<totalLen?cur:'');
  }
  if(n>=totalLen){typed=true;nextBtn.classList.add('show');}
}


const nzC=$('noiseC'),ng=nzC.getContext('2d');
function drawNoise(){
  const id=ng.createImageData(128,72),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  ng.putImageData(id,0,0);
}


let T=0,last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  drawNoise();
  updatePlayer(dt);
  flashCars(T);
  if(AC){birdT-=dt;if(birdT<=0){chirp();birdT=rnd(1.6,5);}}
  typewriter(T);
  renderer.render(scene,camera);
}
loop();
