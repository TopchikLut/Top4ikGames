<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>УГОДА</title>
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;font-family:'VT323','Courier New',monospace;user-select:none}
  #game{position:fixed;inset:0;width:100vw;height:100vh;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:grab}
  #game.dragging{cursor:grabbing}
  #noiseC{position:fixed;inset:0;width:100vw;height:100vh;opacity:.08;pointer-events:none;z-index:5;mix-blend-mode:screen}
  #scan{position:fixed;inset:0;pointer-events:none;z-index:6;background:repeating-linear-gradient(0deg,rgba(0,0,0,.3) 0 1px,transparent 1px 3px)}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:6;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,.85) 100%)}
  
  #btnsWrap{position:fixed;bottom:6%;left:50%;transform:translateX(-50%);z-index:8;display:flex;gap:40px;opacity:0;pointer-events:none;transition:opacity 1.2s}
  #btnsWrap.show{opacity:1;pointer-events:auto}
  .btn{pointer-events:auto;font-family:inherit;font-size:24px;padding:14px 44px;background:#1a0a0a;color:#e8d8b0;border:2px solid #c84040;cursor:pointer;letter-spacing:4px;transition:all .2s;text-shadow:1px 1px 0 #000}
  .btn:hover{background:#c84040;color:#1a0a0a}
  .btn.yes{border-color:#a01818;color:#ffb0a0}
  .btn.yes:hover{background:#a01818;color:#fff}
  .btn.no{border-color:#606060;color:#a0a0a0}
  .btn.no:hover{background:#606060;color:#fff}
  
  #fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:12;transition:opacity 1.5s}
  #bloodDrip{position:fixed;left:50%;bottom:10%;width:0;height:0;background:radial-gradient(circle,rgba(150,15,15,.9) 0%,rgba(100,10,10,.4) 60%,transparent 100%);border-radius:50%;transform:translate(-50%,50%);pointer-events:none;z-index:9;transition:width 1.8s ease-out,height 1.8s ease-out}
</style>
</head>
<body>

<canvas id="noiseC" width="128" height="72"></canvas>
<div id="scan"></div><div id="vig"></div>
<div id="fade"></div>
<div id="bloodDrip"></div>

<div id="btnsWrap">
  <button class="btn yes" id="btnYes">ТАК , ПІДПИСАТИ</button>
  <button class="btn no" id="btnNo">НІ , ВІДМОВИТИСЬ</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
const $=id=>document.getElementById(id);
const rnd=(a,b)=>a+Math.random()*(b-a);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

let scene,camera,renderer;
const PS1_SCALE=0.34;
function ps1Size(){const w=innerWidth,h=innerHeight;return[Math.max(320,w*PS1_SCALE|0),Math.max(180,h*PS1_SCALE|0)];}
scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0808);
scene.fog=new THREE.FogExp2(0x0a0808,0.08);

camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,0.1,100);
const CAM_START={x:0,y:14,z:11};
const CAM_END={x:0,y:4.2,z:3.2};
camera.position.set(CAM_START.x,CAM_START.y,CAM_START.z);
camera.lookAt(0,0,0);
scene.add(camera);

renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'low-power'});
renderer.setPixelRatio(1);
renderer.domElement.id='game';
document.body.prepend(renderer.domElement);
function onResize(){
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  const[iw,ih]=ps1Size();renderer.setSize(iw,ih,false);
  const c=renderer.domElement;c.style.width='100vw';c.style.height='100vh';
}
addEventListener('resize',onResize);onResize();

function ps1(m,jit=120){
  m.onBeforeCompile=s=>{
    s.vertexShader=s.vertexShader
      .replace('#include <common>','#include <common>\nuniform float uJit;')
      .replace('#include <project_vertex>',`#include <project_vertex>
        {vec4 pv=gl_Position;pv.xyz/=pv.w;pv.xy=floor(pv.xy*uJit)/uJit;pv.xyz*=pv.w;gl_Position=pv;}`);
    s.uniforms.uJit={value:jit};
  };
  return m;
}

function makeTex(sz,draw){
  const c=document.createElement('canvas');c.width=c.height=sz;
  draw(c.getContext('2d'),sz);
  const t=new THREE.CanvasTexture(c);
  t.magFilter=t.minFilter=THREE.NearestFilter;t.generateMipmaps=false;
  return t;
}

const texWood=makeTex(128,(g,s)=>{
  g.fillStyle='#3a2818';g.fillRect(0,0,s,s);
  for(let i=0;i<20;i++){
    g.strokeStyle=`rgba(${20+rnd(0,20)|0},${10+rnd(0,15)|0},${5+rnd(0,10)|0},${0.3+rnd(0,0.2)})`;
    g.lineWidth=rnd(1,3);
    g.beginPath();
    const y=rnd(0,s);
    g.moveTo(0,y);
    for(let x=0;x<s;x+=10)g.lineTo(x,y+rnd(-3,3));
    g.stroke();
  }
  for(let i=0;i<400;i++){
    g.fillStyle=`rgba(${rnd(0,40)|0},${rnd(0,30)|0},${rnd(0,20)|0},${rnd(0.1,0.3)})`;
    g.fillRect(rnd(0,s),rnd(0,s),1,1);
  }
});

const texPentagram=makeTex(512,(g,s)=>{
  g.clearRect(0,0,s,s);
  const cx=s/2,cy=s/2,r=s*0.42;
  g.strokeStyle='#8a1010';g.lineWidth=4;
  g.beginPath();g.arc(cx,cy,r*1.08,0,Math.PI*2);g.stroke();
  g.beginPath();
  const pts=[];
  for(let i=0;i<5;i++){
    const a=(i*2*Math.PI/5)-Math.PI/2;
    pts.push({x:cx+Math.cos(a)*r,y:cy+Math.sin(a)*r});
  }
  const order=[0,2,4,1,3];
  g.moveTo(pts[order[0]].x,pts[order[0]].y);
  for(let i=1;i<5;i++)g.lineTo(pts[order[i]].x,pts[order[i]].y);
  g.closePath();g.stroke();
  g.strokeStyle='#6a0808';g.lineWidth=2;
  g.beginPath();g.arc(cx,cy,r*0.45,0,Math.PI*2);g.stroke();
  g.fillStyle='#8a1010';g.font='28px serif';g.textAlign='center';g.textBaseline='middle';
  const runes=['☠','✟','☥','⚰','♰','✞','☦','⚱'];
  for(let i=0;i<8;i++){
    const a=(i*Math.PI*2/8)-Math.PI/2;
    const rx=cx+Math.cos(a)*r*0.88;
    const ry=cy+Math.sin(a)*r*0.88;
    g.fillText(runes[i],rx,ry);
  }
});

const texContract=makeTex(512,(g,s)=>{
  g.fillStyle='#e8e0c8';g.fillRect(0,0,s,s);
  for(let i=0;i<800;i++){
    g.fillStyle=`rgba(${rnd(90,130)|0},${rnd(80,110)|0},${rnd(60,90)|0},${rnd(0.02,0.06)})`;
    g.fillRect(rnd(0,s),rnd(0,s),rnd(1,3),rnd(1,3));
  }
  const edgeG=g.createRadialGradient(s/2,s/2,s*0.35,s/2,s/2,s*0.55);
  edgeG.addColorStop(0,'rgba(0,0,0,0)');edgeG.addColorStop(1,'rgba(80,60,40,.25)');
  g.fillStyle=edgeG;g.fillRect(0,0,s,s);
  
  g.fillStyle='#2a1810';
  g.font='bold 26px "Courier New",monospace';
  g.textAlign='center';
  g.fillText('УГОДА ПРО ПЕРЕДАЧУ ДУШІ',s/2,42);
  
  g.strokeStyle='#6a4830';g.lineWidth=1;
  g.beginPath();g.moveTo(60,58);g.lineTo(s-60,58);g.stroke();
  
  g.font='13px "Courier New",monospace';
  g.textAlign='left';
  const lines=[
    'Цим документом , що нижче підписався ,',
    'Громадянин Фермер Лис , добровільно',
    'передає свою безсмертну душу у повне',
    'володіння Його Високопревосходітельству ,',
    'Князю Темряви , Сатані .',
    '',
    'В обмін на це Жертва зобов\'язується',
    'власноруч вирвати собі ліве або праве око ,',
    'що є актом відкриття дороги',
    'для душі Топчіка в мозок тіла .',
    '',
    'Після виконання вищезазначеної умови ,',
    'душа Топчіка ( відомого також як Гріша',
    'Матченко ) негайно заволодіє фізичним тілом',
    'Жертви .',
    '',
    'Жертва повністю усвідомлює , що наслідком',
    'даної угоди є вічні муки у Пеклі , без',
    'права на оскарження , помилування чи',
    'апеляцію .',
    '',
    'Угоду складено у двох примірниках ,',
    'один з яких залишається у Сатани ,',
    'а інший — у Пана Адвоката .'
  ];
  lines.forEach((line,i)=>{
    g.fillText(line,50,82+i*17);
  });
  
  g.font='12px "Courier New",monospace';
  g.textAlign='left';
  g.fillText('',40,s-75);
  
  g.textAlign='right';
  g.fillStyle='#2a1810';
  g.fillText('Угоду склав :',s-40,s-95);
  g.font='italic 14px "Courier New",monospace';
  g.fillText('Пан Адвокат',s-40,s-75);
});

const texBlood=makeTex(128,(g,s)=>{
  g.clearRect(0,0,s,s);
  for(let i=0;i<40;i++){
    g.fillStyle=`rgba(${rnd(130,170)|0},${rnd(10,30)|0},${rnd(10,30)|0},${rnd(0.5,0.9)})`;
    g.beginPath();
    g.arc(s/2+rnd(-25,25),s/2+rnd(-15,15),rnd(3,14),0,Math.PI*2);
    g.fill();
  }
  for(let i=0;i<6;i++){
    g.strokeStyle=`rgba(${rnd(110,150)|0},${rnd(15,25)|0},${rnd(15,25)|0},${rnd(0.4,0.7)})`;
    g.lineWidth=rnd(1,3);
    g.beginPath();
    const x=rnd(s*0.2,s*0.8),y=rnd(s*0.3,s*0.5);
    g.moveTo(x,y);
    let cx=x,cy=y;
    for(let j=0;j<6;j++){cx+=rnd(-8,8);cy+=rnd(5,15);g.lineTo(cx,cy);}
    g.stroke();
  }
  for(let i=0;i<20;i++){
    g.fillStyle=`rgba(${rnd(120,160)|0},${rnd(10,30)|0},${rnd(10,30)|0},${rnd(0.6,0.9)})`;
    g.beginPath();
    g.arc(rnd(0,s),rnd(0,s),rnd(1,4),0,Math.PI*2);
    g.fill();
  }
});

const texFlame=makeTex(32,(g,s)=>{
  const r=g.createRadialGradient(s/2,s*0.6,1,s/2,s*0.6,s*0.5);
  r.addColorStop(0,'rgba(255,240,180,1)');
  r.addColorStop(0.3,'rgba(255,180,60,0.9)');
  r.addColorStop(0.7,'rgba(255,100,20,0.4)');
  r.addColorStop(1,'rgba(255,60,10,0)');
  g.fillStyle=r;g.fillRect(0,0,s,s);
});

scene.add(new THREE.AmbientLight(0x1a1410,0.4));

const table=new THREE.Mesh(
  new THREE.BoxGeometry(7,0.3,5),
  ps1(new THREE.MeshLambertMaterial({map:texWood}))
);
table.position.y=-0.15;
scene.add(table);

const pentagram=new THREE.Mesh(
  new THREE.PlaneGeometry(3.2,3.2),
  new THREE.MeshBasicMaterial({map:texPentagram,transparent:true,depthWrite:false})
);
pentagram.rotation.x=-Math.PI/2;
pentagram.position.y=0.005;
pentagram.renderOrder=1;
scene.add(pentagram);

const contractGroup=new THREE.Group();
contractGroup.position.set(0,0,0);
scene.add(contractGroup);

const contractBase=new THREE.Mesh(
  new THREE.BoxGeometry(2.4,0.04,3.0),
  ps1(new THREE.MeshLambertMaterial({color:0xd8d0b8}))
);
contractBase.position.y=0.12;
contractGroup.add(contractBase);

const contract=new THREE.Mesh(
  new THREE.PlaneGeometry(2.4,3.0),
  ps1(new THREE.MeshLambertMaterial({map:texContract}))
);
contract.rotation.x=-Math.PI/2;
contract.position.y=0.145;
contract.renderOrder=2;
contractGroup.add(contract);

const bloodStain=new THREE.Mesh(
  new THREE.PlaneGeometry(1.0,0.6),
  new THREE.MeshBasicMaterial({map:texBlood,transparent:true,opacity:0,depthWrite:false})
);
bloodStain.rotation.x=-Math.PI/2;
bloodStain.position.set(-0.6,0.15,1.1);
bloodStain.renderOrder=3;
bloodStain.visible=false;
scene.add(bloodStain);

const candles=[];
const candlePositions=[
  [-1.5,0,-1.5],[1.5,0,-1.5],[-1.5,0,1.5],[1.5,0,1.5],
  [0,0,-1.7],[0,0,1.7],[-1.7,0,0],[1.7,0,0]
];

candlePositions.forEach(pos=>{
  const candle=new THREE.Group();
  const wax=new THREE.Mesh(
    new THREE.CylinderGeometry(0.08,0.1,0.5,8),
    ps1(new THREE.MeshLambertMaterial({color:0xe8e0d0}))
  );
  wax.position.y=0.25;
  candle.add(wax);
  
  const flame=new THREE.Sprite(
    new THREE.SpriteMaterial({map:texFlame,transparent:true,blending:THREE.AdditiveBlending})
  );
  flame.scale.set(0.25,0.35,1);
  flame.position.y=0.55;
  candle.add(flame);
  
  const light=new THREE.PointLight(0xff8844,0.6,4,2);
  light.position.y=0.55;
  candle.add(light);
  
  candle.position.set(pos[0],pos[1],pos[2]);
  scene.add(candle);
  candles.push({flame,light,phase:rnd(0,Math.PI*2)});
});

let state='approaching',T=0,approachT=0,bloodOpacity=0,transitioning=false;
const APPROACH_DURATION=3.0;

let viewCenter={x:0,z:0};
let viewZoom=1.0;
let zoomTarget=1.0;
let zoomedIn=false;
const ZOOM_NORMAL=1.0;
const ZOOM_CLOSE=0.23;
let isDragging=false,dragStart={x:0,y:0};
const PAN_LIMIT_X=1.8;
const PAN_LIMIT_Z=3.2;

renderer.domElement.addEventListener('dblclick',function(e){
  if(state!=='ready')return;
  zoomedIn=!zoomedIn;
  if(zoomedIn){
    zoomTarget=ZOOM_CLOSE;
  }else{
    zoomTarget=ZOOM_NORMAL;
    viewCenter.x=0;viewCenter.z=0;
  }
});

renderer.domElement.addEventListener('mousedown',function(e){
  if(state!=='ready')return;
  isDragging=true;
  dragStart={x:e.clientX,y:e.clientY};
  renderer.domElement.classList.add('dragging');
});
window.addEventListener('mousemove',function(e){
  if(!isDragging||state!=='ready')return;
  const speed=0.002*viewZoom;
  const dx=(e.clientX-dragStart.x)*speed;
  const dy=(e.clientY-dragStart.y)*speed;
  viewCenter.x=clamp(viewCenter.x-dx,-PAN_LIMIT_X,PAN_LIMIT_X);
  viewCenter.z=clamp(viewCenter.z-dy,-PAN_LIMIT_Z,PAN_LIMIT_Z);
  dragStart={x:e.clientX,y:e.clientY};
});
window.addEventListener('mouseup',function(){
  if(isDragging){
    isDragging=false;
    renderer.domElement.classList.remove('dragging');
  }
});

$('btnYes').addEventListener('click',function(){
  if(transitioning)return;
  transitioning=true;
  bloodStain.visible=true;
  const animateBlood=function(){
    if(bloodOpacity<1){
      bloodOpacity+=0.015;
      bloodStain.material.opacity=bloodOpacity;
      requestAnimationFrame(animateBlood);
    }else{
      const drip=$('bloodDrip');
      drip.style.width='200px';drip.style.height='200px';
      setTimeout(function(){
        drip.style.width='150vw';drip.style.height='150vh';
        $('fade').style.opacity=1;
        setTimeout(function(){window.location.href='15.html';},1600);
      },800);
    }
  };
  animateBlood();
});

$('btnNo').addEventListener('click',function(){
  if(transitioning)return;
  transitioning=true;
  $('fade').style.opacity=1;
  setTimeout(function(){window.location.href='14.html';},1500);
});

let AC=null,master;
function noiseBuf(len){const b=AC.createBuffer(1,AC.sampleRate*len,AC.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return b;}
function initAudio(){
  if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();
  master=AC.createGain();master.gain.value=0.6;master.connect(AC.destination);
  const w=AC.createBufferSource();w.buffer=noiseBuf(3);w.loop=true;
  const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=180;
  const wg=AC.createGain();wg.gain.value=0.03;
  w.connect(f);f.connect(wg);wg.connect(master);w.start();
  const o=AC.createOscillator();o.type='sine';o.frequency.value=38;
  const og=AC.createGain();og.gain.value=0.04;o.connect(og);og.connect(master);o.start();
}
initAudio();

function easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;}

const nzC=$('noiseC'),ng=nzC.getContext('2d');
function drawNoise(){
  const id=ng.createImageData(128,72),d=id.data;
  for(let i=0;i<d.length;i+=4){const v=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  ng.putImageData(id,0,0);
}

let last=performance.now();
function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  const dt=Math.min(0.05,(now-last)/1000);last=now;T+=dt;
  
  drawNoise();
  
  candles.forEach(function(c){
    c.phase+=dt*8;
    const flicker=0.8+Math.sin(c.phase)*0.15+Math.sin(c.phase*2.3)*0.05;
    c.light.intensity=0.6*flicker;
    c.flame.material.opacity=0.7+flicker*0.3;
    c.flame.scale.y=0.35+Math.sin(c.phase*1.5)*0.03;
  });
  
  if(state==='approaching'){
    approachT+=dt;
    const p=Math.min(1,approachT/APPROACH_DURATION);
    const ep=easeInOut(p);
    camera.position.x=CAM_START.x+(CAM_END.x-CAM_START.x)*ep;
    camera.position.y=CAM_START.y+(CAM_END.y-CAM_START.y)*ep;
    camera.position.z=CAM_START.z+(CAM_END.z-CAM_START.z)*ep;
    camera.lookAt(0,0,0);
    
    if(p>=1){
      state='ready';
      $('btnsWrap').classList.add('show');
    }
  }else if(state==='ready'){
    viewZoom+=(zoomTarget-viewZoom)*Math.min(1,dt*4.0);
    
    const baseY=CAM_END.y*viewZoom;
    const baseZ=CAM_END.z*viewZoom;
    camera.position.x=viewCenter.x;
    camera.position.y=baseY;
    camera.position.z=viewCenter.z+baseZ;
    camera.lookAt(viewCenter.x,0.1,viewCenter.z);
  }
  
  renderer.render(scene,camera);
}
loop();
</script>
</body>
</html>
